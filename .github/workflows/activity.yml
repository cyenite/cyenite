name: Contribution chart

on:
  schedule:
    - cron: "7 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-chart
  cancel-in-progress: false

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the chart
        run: python scripts/activity.py
        env:
          ACTIVITY_LOGIN: ${{ github.repository_owner }}
          # Deliberately not a PAT: this token sees exactly what the public profile graph shows, so private work arrives
          # as anonymous daily counts (with "Include private contributions" on) and the chart can never reveal more.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Update contribution chart $(date -u +%F)"
          git push
